[project]
name = "loglens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alibakhsha", email = "bakhshaali@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
loglens = "loglens.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
